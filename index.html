<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPA Poster Review</title>
<style>
  body { margin: 0; color: #20221e; background: #f5f4ef; font: 1rem system-ui, sans-serif; }
  header, main { max-width: 76rem; margin: auto; padding: 1rem; }
  header, nav, .actions { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  h1 { margin: 0 auto 0 0; font-size: 1.35rem; }
  h2 { margin: .5rem 0; }
  button, select { font: inherit; padding: .45rem .7rem; }
  button[aria-pressed="true"] { background: #254638; color: white; }
  figure { margin: 1rem 0; padding: 1rem; background: white; text-align: center; }
  #scan { display: inline-block; position: relative; max-width: 100%; vertical-align: top; touch-action: none; cursor: crosshair; }
  #crop-box { position: absolute; box-sizing: border-box; outline: 2px solid #26d8ac; box-shadow: 0 0 0 1px #17372e; cursor: move; }
  .handle { position: absolute; padding: 0; width: 16px; height: 16px; border: 1px solid #17372e; border-radius: 50%; background: #26d8ac; transform: translate(-50%, -50%); }
  .nw, .se { cursor: nwse-resize; }
  .ne, .sw { cursor: nesw-resize; }
  .ne, .se { left: 100%; }
  .sw, .se { top: 100%; }
  .nw, .sw { left: 0; }
  .nw, .ne { top: 0; }
  .margins { display: flex; flex-wrap: wrap; gap: .65rem; margin: .75rem 0; }
  .margins input { width: 5rem; font: inherit; }
  img { display: block; width: auto; height: auto; max-width: 100%; max-height: 65vh; margin: auto; }
  textarea { display: block; width: min(100%, 40rem); font: inherit; box-sizing: border-box; }
  .links { display: flex; gap: 1rem; flex-wrap: wrap; }
  .rotation-review { border-top: 1px solid #d7d9cd; margin-top: 1rem; padding-top: 1rem; }
  .comparison-group { border-top: 1px solid #d7d9cd; margin-top: 1.5rem; padding-top: 1rem; }
  .compare-scans { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
  .compare-card { background: white; padding: .85rem; display: grid; grid-template-rows: 15rem 1fr auto; gap: .6rem; min-width: 0; }
  .compare-card img { width: 100%; height: 100%; object-fit: contain; }
  .compare-card p { margin: 0; overflow-wrap: anywhere; }
  .compare-card button { font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
<header>
  <h1>WPA Poster Review</h1>
  <label>View <select id="filter">
    <option value="all">All</option><option value="unreviewed">Unreviewed</option>
    <option value="kept">Starred</option><option value="rejected">Rejected</option>
    <optgroup label="Rotation">
      <option value="rotation-pending">Awaiting final review</option>
      <option value="rotation-selected">Rotation picks</option>
      <option value="rotation-passed">Passed at final review</option>
    </optgroup>
  </select></label>
  <label id="topics-control">Topic <select id="topic">
    <option value="all">All topics</option>
    <option value="parks">National parks &amp; monuments</option>
    <option value="travel">Travel &amp; tourism</option>
    <option value="stage">Stage &amp; music</option>
    <option value="art">Art &amp; exhibitions</option>
    <option value="sports">Sports &amp; recreation</option>
    <option value="health">Public health</option>
    <option value="wartime">Wartime</option>
  </select></label>
  <label id="source-control">Source <select id="catalog-source">
    <option value="all">All sources</option>
    <option value="wpa">WPA collection</option>
    <option value="additions">Public-domain &amp; CC0 additions</option>
  </select></label>
  <button id="compare" aria-pressed="false">Compare starred scans</button>
  <button id="export">Export decisions</button>
  <label>Restore decisions <input id="import" type="file" accept=".json,application/json"></label>
</header>
<main>
  <nav id="browse" aria-label="Poster navigation">
    <button id="previous">Previous</button><button id="next">Next</button>
    <span id="counts" aria-live="polite"></span>
  </nav>
  <p id="status" role="status"></p>
  <section id="comparison" aria-labelledby="comparison-title" hidden>
    <h2 id="comparison-title">Starred scans by title</h2>
    <p>Same-title groups can include different artwork. Compare the scans before keeping one.</p>
    <p id="comparison-count"></p>
    <button id="undo-compare" hidden>Undo last selection</button>
    <div id="comparison-groups"></div>
  </section>
  <template id="scan-card">
    <article class="compare-card">
      <div><img alt="" loading="lazy" referrerpolicy="no-referrer"></div>
      <p></p>
      <div class="actions">
        <button type="button" data-action="inspect">Inspect scan</button>
        <button type="button" data-action="pick">Keep only this scan</button>
      </div>
    </article>
  </template>
  <article id="record" hidden>
    <figure>
      <div id="scan" hidden>
        <img id="poster" alt="" draggable="false" referrerpolicy="no-referrer">
        <div id="crop-box" hidden>
          <button type="button" class="handle nw" data-corner="nw" aria-label="Top left crop corner" tabindex="-1"></button>
          <button type="button" class="handle ne" data-corner="ne" aria-label="Top right crop corner" tabindex="-1"></button>
          <button type="button" class="handle sw" data-corner="sw" aria-label="Bottom left crop corner" tabindex="-1"></button>
          <button type="button" class="handle se" data-corner="se" aria-label="Bottom right crop corner" tabindex="-1"></button>
        </div>
      </div>
      <p id="image-error" hidden>Preview unavailable. Open the source record to inspect the scan.</p>
    </figure>
    <section id="crop-controls" aria-label="Crop review" hidden>
      <p id="crop-status" role="status"></p>
      <div class="actions">
        <button id="approve-crop">Approve outline</button>
        <button id="draw-crop" aria-pressed="false">Draw new box</button>
        <button id="suggest-crop">Restore suggestion</button>
        <button id="full-scan">Use full scan</button>
      </div>
      <div class="margins">
        <label>Left % <input id="crop-left" type="number" min="0" max="99" step="0.1"></label>
        <label>Top % <input id="crop-top" type="number" min="0" max="99" step="0.1"></label>
        <label>Right % <input id="crop-right" type="number" min="0" max="99" step="0.1"></label>
        <label>Bottom % <input id="crop-bottom" type="number" min="0" max="99" step="0.1"></label>
      </div>
    </section>
    <h2 id="title"></h2>
    <p id="details"></p>
    <p class="links">
      <a id="source" target="_blank" rel="noopener">Source record</a>
      <a id="original" target="_blank" rel="noopener">Open source image</a>
    </p>
    <div class="actions">
      <button id="keep" aria-pressed="false">★ Star to keep</button>
      <button id="reject" aria-pressed="false">Reject</button>
      <button id="clear">Clear decision</button>
    </div>
    <section id="rotation-review" class="rotation-review" aria-labelledby="rotation-title" hidden>
      <h3 id="rotation-title">Final review</h3>
      <p>Would you want this poster on your wall all day?</p>
      <div class="actions">
        <button id="select-rotation" aria-pressed="false">Select for rotation</button>
        <button id="pass-rotation" aria-pressed="false">Pass for rotation</button>
        <button id="clear-rotation" hidden>Clear final decision</button>
      </div>
    </section>
    <p><label for="note">Review note</label>
      <textarea id="note" rows="2" placeholder="For example, added text or a damaged scan"></textarea>
    </p>
  </article>
</main>

<script type="module">
const fullScan = [0, 0, 1, 1];
const minimumSize = 0.01;
const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));

function validCrop(box) {
  return Array.isArray(box) && box.length === 4 &&
    box.every(value => Number.isFinite(value) && value >= 0 && value <= 1) &&
    box[2] - box[0] >= minimumSize - 1e-9 && box[3] - box[1] >= minimumSize - 1e-9;
}

function suggestCrop(image) {
  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 320 / Math.max(image.naturalWidth, image.naturalHeight));
  const width = canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
  const height = canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0, width, height);
  const { data } = context.getImageData(0, 0, width, height);

  // Look for a consistent margin from each edge. Keep a safety margin and
  // leave uncertain sides intact, especially on artwork that reaches an edge.
  function trim(vertical, reverse) {
    const depth = vertical ? height : width;
    const across = vertical ? width : height;
    const samples = [];
    const sample = (line, acrossPixel) => {
      const inward = reverse ? depth - 1 - line : line;
      const offset = (vertical ? inward * width + acrossPixel : acrossPixel * width + inward) * 4;
      return [data[offset], data[offset + 1], data[offset + 2]];
    };
    for (let j = Math.floor(across * 0.1); j < across * 0.9; j += 1) samples.push(j);
    const edges = samples.map(j => sample(0, j));
    const background = [0, 1, 2].map(channel => edges.map(rgb => rgb[channel]).sort((a, b) => a - b)[Math.floor(edges.length / 2)]);
    const similar = rgb => rgb.every((value, channel) => Math.abs(value - background[channel]) <= 28);
    let rows = 0;
    let content = 0;
    const limit = Math.floor(depth * 0.28);
    for (let line = 0; line < limit; line += 1) {
      const agreement = samples.filter(j => similar(sample(line, j))).length / samples.length;
      content = agreement < 0.84 ? content + 1 : 0;
      if (content === 3) {
        rows = line - 2;
        break;
      }
    }
    return rows >= Math.max(3, depth * 0.02) ? Math.max(0, rows - 2) / depth : 0;
  }

  return [trim(false, false), trim(true, false), 1 - trim(false, true), 1 - trim(true, true)];
}

function editCrop(box, mode, start, point) {
  const [left, top, right, bottom] = box;
  if (mode === "move") {
    const dx = clamp(point[0] - start[0], -left, 1 - right);
    const dy = clamp(point[1] - start[1], -top, 1 - bottom);
    return [left + dx, top + dy, right + dx, bottom + dy].map(value => clamp(value));
  }
  if (mode === "draw") {
    return [Math.min(start[0], point[0]), Math.min(start[1], point[1]),
      Math.max(start[0], point[0]), Math.max(start[1], point[1])];
  }
  return [
    mode.includes("w") ? clamp(point[0], 0, right - minimumSize) : left,
    mode.includes("n") ? clamp(point[1], 0, bottom - minimumSize) : top,
    mode.includes("e") ? clamp(point[0], left + minimumSize, 1) : right,
    mode.includes("s") ? clamp(point[1], top + minimumSize, 1) : bottom,
  ];
}

const elements = Object.fromEntries([...document.querySelectorAll("[id]")].map(el => [el.id, el]));
const storageKey = "wpa-poster-review-v1";
let records = [];
let decisions = {};
let visible = [];
let index = 0;
let comparing = false;
let lastUnstarred = [];
let activeScan = null;
let crop = fullScan;
let suggestion = fullScan;
let hasSuggestion = false;
let gesture = null;
let drawNext = false;
const cropInputs = ["left", "top", "right", "bottom"].map(edge => elements[`crop-${edge}`]);

function paintCrop() {
  const [left, top, right, bottom] = crop;
  Object.assign(elements["crop-box"].style, {
    left: `${100 * left}%`, top: `${100 * top}%`,
    width: `${100 * (right - left)}%`, height: `${100 * (bottom - top)}%`,
  });
  [left, top, 1 - right, 1 - bottom].forEach((value, i) => {
    cropInputs[i].value = (value * 100).toFixed(1);
  });
  const approved = decisions[activeScan?.record_id]?.approved_crop;
  const saved = approved?.every((value, i) => value === crop[i]);
  elements["approve-crop"].disabled = Boolean(saved);
  elements["crop-status"].textContent = saved
    ? "Outline approved."
    : hasSuggestion
      ? "Drag the corners or move the box. Choose Draw new box to replace it."
      : "No clear border found. Adjust the full-scan outline or draw a new box.";
}

async function loadScan(record) {
  activeScan = record;
  const image = elements.poster;
  image.removeAttribute("src");
  elements.scan.hidden = true;
  elements["image-error"].hidden = true;
  elements["crop-controls"].hidden = true;
  gesture = null;
  drawNext = false;
  elements["draw-crop"].setAttribute("aria-pressed", "false");
  const attempts = [];
  const preview = record.preview_url;
  if (preview) {
    if (!document.getElementById("embedded-catalog")) {
      attempts.push([new URL(`./scan/${record.record_id}`, import.meta.url), false]);
    }
    attempts.push([preview, true], [preview, false]);
  }

  for (const [url, cors] of attempts) {
    if (activeScan !== record) return;
    if (cors) image.crossOrigin = "anonymous";
    else image.removeAttribute("crossorigin");
    image.src = url;
    try {
      await image.decode();
    } catch {
      continue;
    }
    if (activeScan !== record) return;
    try {
      suggestion = suggestCrop(image);
      hasSuggestion = suggestion.some((value, i) => value !== fullScan[i]);
    } catch {
      suggestion = fullScan;
      hasSuggestion = false;
    }
    crop = decisions[record.record_id]?.approved_crop || suggestion;
    elements.scan.hidden = false;
    elements["crop-box"].hidden = false;
    elements["crop-controls"].hidden = false;
    elements["suggest-crop"].disabled = !hasSuggestion;
    paintCrop();
    return;
  }
  if (activeScan === record) elements["image-error"].hidden = false;
}

function setCrop(box) {
  if (!validCrop(box)) return;
  crop = box;
  paintCrop();
}

function position(event) {
  const rect = elements.poster.getBoundingClientRect();
  return [clamp((event.clientX - rect.left) / rect.width), clamp((event.clientY - rect.top) / rect.height)];
}

elements.scan.onpointerdown = event => {
  if (event.button !== 0) return;
  const mode = drawNext ? "draw" : event.target.dataset.corner ||
    (elements["crop-box"].contains(event.target) ? "move" : "draw");
  drawNext = false;
  elements["draw-crop"].setAttribute("aria-pressed", "false");
  gesture = { pointer: event.pointerId, mode, start: position(event), box: crop };
  elements.scan.setPointerCapture(event.pointerId);
};

elements.scan.onpointermove = event => {
  if (gesture?.pointer !== event.pointerId) return;
  setCrop(editCrop(gesture.box, gesture.mode, gesture.start, position(event)));
};

elements.scan.onlostpointercapture = () => { gesture = null; };
cropInputs.forEach(input => {
  input.onchange = () => {
    const values = cropInputs.map(field => field.valueAsNumber / 100);
    const box = [values[0], values[1], 1 - values[2], 1 - values[3]];
    if (validCrop(box)) setCrop(box);
    else {
      paintCrop();
      elements["crop-status"].textContent = "Margins must leave at least 1% of the scan in each direction.";
    }
  };
});

elements["draw-crop"].onclick = () => {
  drawNext = !drawNext;
  elements["draw-crop"].setAttribute("aria-pressed", String(drawNext));
  if (drawNext) elements["crop-status"].textContent = "Drag on the scan to draw a replacement outline.";
  else paintCrop();
};

elements["suggest-crop"].onclick = () => setCrop(suggestion);
elements["full-scan"].onclick = () => setCrop(fullScan);
elements["approve-crop"].onclick = () => {
  const id = activeScan.record_id;
  decisions[id] = { status: null, note: "", ...decisions[id], approved_crop: [...crop] };
  persist();
  paintCrop();
};

function titleGroup(title) {
  const quotedTitle = title.match(/["“]([^"”]{3,})["”]/)?.[1];
  return (quotedTitle || title).normalize("NFKD").replace(/\p{M}/gu, "")
    .toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
}

function renderComparison() {
  const byTitle = new Map();
  for (const record of records) {
    if (decisions[record.record_id]?.status !== "kept") continue;
    const key = titleGroup(record.title);
    if (!key) continue;
    if (!byTitle.has(key)) byTitle.set(key, []);
    byTitle.get(key).push(record);
  }
  const groups = [...byTitle.values()].filter(group => group.length > 1);
  elements["comparison-count"].textContent = groups.length
    ? `${groups.length} possible duplicate ${groups.length === 1 ? "group" : "groups"} · ${groups.flat().length} starred scans`
    : "No starred title groups to compare.";
  elements["undo-compare"].hidden = !lastUnstarred.length;
  elements["comparison-groups"].replaceChildren();
  for (const group of groups) {
    const section = document.createElement("section");
    section.className = "comparison-group";
    const heading = document.createElement("h3");
    heading.textContent = group[0].title.match(/["“]([^"”]{3,})["”]/)?.[1] || group[0].title;
    const gallery = document.createElement("div");
    gallery.className = "compare-scans";
    section.append(heading, gallery);
    for (const record of group) {
      const card = elements["scan-card"].content.cloneNode(true);
      const image = card.querySelector("img");
      image.alt = record.title;
      const imageFrame = image.parentElement;
      const showUnavailable = () => { imageFrame.textContent = "Preview unavailable"; };
      image.onerror = showUnavailable;
      if (record.preview_url) image.src = record.preview_url;
      else showUnavailable();
      const details = card.querySelector("p");
      details.textContent = [
        record.title, record.artist, record.date, record.source_name || `LoC ${record.record_id}`,
        decisions[record.record_id]?.approved_crop ? "Crop approved" : "",
        decisions[record.record_id]?.rotation === "selected" ? "Rotation pick" : "",
      ].filter(Boolean).join(" · ");
      card.querySelector('[data-action="inspect"]').onclick = () => {
        comparing = false;
        elements.filter.value = "all";
        elements.topic.value = "all";
        elements["catalog-source"].value = "all";
        index = records.indexOf(record);
        render();
      };
      card.querySelector('[data-action="pick"]').onclick = () => {
        lastUnstarred = group.filter(scan => scan !== record).map(scan => scan.record_id);
        for (const id of lastUnstarred) decisions[id] = { ...decisions[id], status: null };
        persist();
        elements.status.textContent = `Kept ${record.title} (${record.record_id}). Removed ${lastUnstarred.length} other ${lastUnstarred.length === 1 ? "star" : "stars"}.`;
        render();
      };
      gallery.append(card);
    }
    elements["comparison-groups"].append(section);
  }
}

function matchesView(decision, filter) {
  if (filter.startsWith("rotation-")) {
    return decision?.status === "kept" && `rotation-${decision.rotation || "pending"}` === filter;
  }
  return filter === "all" || filter === (decision?.status || "unreviewed");
}

function render() {
  elements.compare.setAttribute("aria-pressed", String(comparing));
  elements.compare.textContent = comparing ? "Back to poster review" : "Compare starred scans";
  elements.browse.hidden = comparing;
  elements.filter.disabled = comparing;
  elements["topics-control"].hidden = comparing;
  elements["source-control"].hidden = comparing;
  elements.comparison.hidden = !comparing;
  if (comparing) {
    elements.record.hidden = true;
    renderComparison();
    return;
  }

  const topic = elements.topic.value;
  const filter = elements.filter.value;
  const source = elements["catalog-source"].value;
  visible = records.filter(record =>
    (source === "all" || (source === "additions" ? record.source_name : !record.source_name)) &&
    (topic === "all" || record.topics?.includes(topic)) &&
    matchesView(decisions[record.record_id], filter)
  );
  index = Math.max(0, Math.min(index, visible.length - 1));
  const record = visible[index];
  elements.record.hidden = !record;
  elements.previous.disabled = index === 0;
  elements.next.disabled = index >= visible.length - 1;
  const reviewed = records.map(record => decisions[record.record_id]);
  elements.counts.textContent = [
    record ? `${index + 1} of ${visible.length}` : "No matching posters",
    `${reviewed.filter(decision => decision?.status === "kept").length} starred`,
    `${reviewed.filter(decision => decision?.status === "rejected").length} rejected`,
    `${reviewed.filter(decision => matchesView(decision, "rotation-selected")).length} rotation picks`,
  ].join(" · ");
  if (!record) return;

  const decision = decisions[record.record_id];
  elements.title.textContent = record.title;
  elements.details.textContent = [record.artist, record.date, record.rights_advisory].filter(Boolean).join(" · ");
  elements.source.href = record.item_url;
  elements.source.textContent = record.source_name ? `Source & rights · ${record.source_name}` : "Library of Congress record";
  elements.original.href = record.source_image_url || record.preview_url;
  elements.original.hidden = !(record.source_image_url || record.preview_url);
  elements.original.textContent = record.source_image_url ? "Open original scan" : "Open scan preview";
  elements.poster.alt = record.title;
  if (activeScan !== record) loadScan(record);
  elements.keep.setAttribute("aria-pressed", decision?.status === "kept");
  elements.reject.setAttribute("aria-pressed", decision?.status === "rejected");
  elements.clear.disabled = !decision?.status && !decision?.note;
  elements.note.value = decision?.note || "";
  elements["rotation-review"].hidden = decision?.status !== "kept";
  elements["select-rotation"].setAttribute("aria-pressed", String(decision?.rotation === "selected"));
  elements["pass-rotation"].setAttribute("aria-pressed", String(decision?.rotation === "passed"));
  elements["clear-rotation"].hidden = !decision?.rotation;
}

function saveDecision(status) {
  const record = visible[index];
  if (!record) return;
  const note = elements.note.value.trim();
  const previous = decisions[record.record_id];
  if (status || note || previous?.approved_crop || previous?.rotation) decisions[record.record_id] = { ...previous, status, note };
  else delete decisions[record.record_id];
  persist();
  render();
}

function saveRotation(rotation) {
  const record = visible[index];
  if (!record) return;
  const decision = decisions[record.record_id];
  if (decision?.status !== "kept") return;
  if (rotation) decision.rotation = rotation;
  else delete decision.rotation;
  persist();
  render();
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(decisions));
    elements.status.textContent = "";
  } catch {
    elements.status.textContent = "Browser storage is unavailable. Export decisions before closing this page.";
  }
}

function move(step) {
  index += step;
  render();
}

elements.previous.onclick = () => move(-1);
elements.next.onclick = () => move(1);
for (const control of [elements.filter, elements.topic, elements["catalog-source"]]) {
  control.onchange = () => { index = 0; render(); };
}
elements.compare.onclick = () => { comparing = !comparing; render(); };
elements["undo-compare"].onclick = () => {
  for (const id of lastUnstarred) {
    if (decisions[id]?.status === null) decisions[id].status = "kept";
  }
  lastUnstarred = [];
  persist();
  render();
};
elements["select-rotation"].onclick = () => saveRotation("selected");
elements["pass-rotation"].onclick = () => saveRotation("passed");
elements["clear-rotation"].onclick = () => saveRotation(null);
elements.keep.onclick = () => saveDecision("kept");
elements.reject.onclick = () => saveDecision("rejected");
elements.clear.onclick = () => { elements.note.value = ""; saveDecision(null); };
elements.note.onchange = () => saveDecision(decisions[visible[index]?.record_id]?.status || null);
elements.export.onclick = () => {
  const starred = records.filter(record => decisions[record.record_id]?.status === "kept")
    .map(record => ({ ...record, approved_crop: decisions[record.record_id].approved_crop }));
  const rotation = starred.filter(record => matchesView(decisions[record.record_id], "rotation-selected"));
  const file = new Blob([JSON.stringify({ decisions, starred, rotation }, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = "wpa-review-decisions.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};
elements.import.onchange = async () => {
  try {
    const imported = JSON.parse(await elements.import.files[0].text()).decisions;
    if (!imported || Array.isArray(imported) || typeof imported !== "object") throw new Error();
    for (const [id, value] of Object.entries(imported)) {
      if (!/^(?:commons-)?\d+$/.test(id) || !value ||
          !["kept", "rejected", null].includes(value.status) || typeof value.note !== "string" ||
          ("approved_crop" in value && !validCrop(value.approved_crop)) ||
          ("rotation" in value && !["selected", "passed"].includes(value.rotation))) {
        throw new Error();
      }
    }
    decisions = { ...decisions, ...imported };
    activeScan = null;
    lastUnstarred = [];
    persist();
    render();
  } catch {
    elements.status.textContent = "Choose a decisions JSON file exported from this reviewer.";
  } finally {
    elements.import.value = "";
  }
};
document.addEventListener("keydown", event => {
  if (comparing || event.altKey || event.ctrlKey || event.metaKey || /INPUT|SELECT|TEXTAREA|BUTTON|A/.test(event.target.tagName)) return;
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "ArrowRight") move(1);
  if (event.key.toLowerCase() === "s") saveDecision("kept");
  if (event.key.toLowerCase() === "r") saveDecision("rejected");
});

async function loadRecords() {
  const embedded = document.getElementById("embedded-catalog");
  if (embedded) return JSON.parse(embedded.textContent);

  const collection = await fetch(new URL("./candidates.json", import.meta.url));
  if (collection.ok) {
    const additions = await fetch(new URL("./additions.json", import.meta.url));
    return [
      ...await collection.json(),
      ...(additions.ok ? await additions.json() : []),
    ];
  }

  const response = await fetch(new URL("../posters.json", import.meta.url));
  if (!response.ok) throw new Error("Catalog files are missing from this URL. Open the standalone reviewer or serve the repository root.");
  const pilot = await response.json();
  elements.status.textContent = "Showing the four pilot records. Load the full collection to review more posters.";
  return [...pilot.posters, pilot.fallback].map(record => {
    const { record_id, title, artist, date, rights_advisory, source_image_url } = record;
    const path = new URL(source_image_url).pathname.replace(/^\/master\//, "/storage-services/service/").replace(/u\.tif$/, "r.jpg");
    return {
      record_id, title, artist, date, rights_advisory, source_image_url,
      item_url: `https://www.loc.gov/item/${record_id}/`,
      preview_url: `https://tile.loc.gov${path}`,
    };
  });
}

try {
  decisions = JSON.parse(localStorage.getItem(storageKey)) || {};
} catch {
  elements.status.textContent = "Saved decisions could not be loaded.";
}
try {
  records = await loadRecords();
  render();
} catch (error) {
  elements.status.textContent = error.message;
}

</script>
